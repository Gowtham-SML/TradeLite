<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeLite | Shopping Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#D1855C", "primary-dark": "#b36d46", "secondary": "#AAC4F5", "background-light": "#F8FAFB", "background-dark": "#0a0f10" }, fontFamily: { "sans": ["'Inter'", "sans-serif"] }, borderRadius: { "px": "1px", "xs": "2px", "sm": "4px", "DEFAULT": "8px", "lg": "12px", "xl": "16px", "2xl": "24px", "3xl": "32px", "full": "9999px" }, }, }, }
  </script>
</head>
<body class="bg-[var(--color-background)]">
  
  <nav class="sticky top-0 z-[100] w-full glass-nav px-4 md:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
        </div>
        <span class="font-bold text-lg tracking-tight">TradeLite</span>
      </a>
    </div>
    <div class="flex items-center gap-4">
      <a href="cart.html" class="relative p-2 text-slate-700">
        <span class="material-symbols-outlined font-bold text-primary">shopping_cart_checkout</span>
        <span class="cart-badge hidden absolute top-1 right-0 bg-primary text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto w-full px-4 md:px-8 py-8 md:py-12" id="cart-container">
    <!-- Rendered by JS -->
  </main>

  <footer class="bg-white border-t border-slate-200 pt-16 pb-8 mt-20">
    <div class="max-w-7xl mx-auto w-full px-4 md:px-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-12 mb-16">
        <div class="col-span-1 pr-8">
          <div class="flex items-center gap-2 mb-6">
            <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
              <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
            </div>
            <span class="font-bold text-xl tracking-tight" id="footer-store-name">TradeLite</span>
          </div>
          <p class="text-slate-500 text-sm leading-relaxed mb-6 font-medium">Curated heritage pieces, crafted for the contemporary wardrobe.</p>
        </div>
        <div>
          <h4 class="font-bold text-slate-900 mb-6 tracking-tight">EXPLORE</h4>
          <ul class="space-y-4">
            <li><a href="products.html" class="text-sm text-slate-500 hover:text-primary transition-colors font-medium">New Arrivals</a></li>
            <li><a href="products.html" class="text-sm text-slate-500 hover:text-primary transition-colors font-medium">Collections</a></li>
            <li><a href="#" class="text-sm text-slate-500 hover:text-primary transition-colors font-medium">About</a></li>
          </ul>
        </div>
        <div>
          <h4 class="font-bold text-slate-900 mb-6 tracking-tight">CONTACT</h4>
          <ul class="space-y-4">
            <li class="flex items-center gap-2 text-sm text-slate-500 font-medium">
              <span class="material-symbols-outlined text-[18px]">mail</span> <span id="footer-email">hello@tradelite.in</span>
            </li>
            <li class="flex items-center gap-2 text-sm text-slate-500 font-medium pb-2">
              <span class="material-symbols-outlined text-[18px]">call</span> <span id="footer-wa-num">+91 90000 00000</span>
            </li>
          </ul>
        </div>
      </div>
      <div class="border-t border-slate-100 pt-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <p class="text-xs text-slate-400 font-medium">© 2026 TradeLite. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="js/pages/cart.js"></script>
</body>
</html>
