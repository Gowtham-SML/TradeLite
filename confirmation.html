<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeLite | Order Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#D1855C", "primary-dark": "#b36d46", "secondary": "#AAC4F5", "background-light": "#F8FAFB", "background-dark": "#0a0f10", "success": "#22c55e" }, fontFamily: { "sans": ["'Inter'", "sans-serif"] }, borderRadius: { "px": "1px", "xs": "2px", "sm": "4px", "DEFAULT": "8px", "lg": "12px", "xl": "16px", "2xl": "24px", "3xl": "32px", "full": "9999px" }, }, }, }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  
  <nav class="sticky top-0 z-[100] w-full bg-white border-b border-slate-200 px-4 md:px-8 h-16 flex items-center justify-between shadow-sm">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
        <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
      </div>
      <span class="font-bold text-lg tracking-tight text-slate-900">TradeLite</span>
    </a>
    <div class="flex items-center gap-1.5 bg-green-50 text-success text-[10px] sm:text-xs font-bold px-2 py-1 sm:px-3 sm:py-1.5 rounded-full border border-green-200">
      <span class="material-symbols-outlined text-[16px]">lock</span>
      SECURE SSL ENCRYPTION
    </div>
  </nav>

  <main class="flex-1 max-w-[480px] w-full mx-auto px-6 pt-20 pb-12 flex flex-col items-center text-center">
    
    <div class="relative mb-8">
      <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center text-primary">
        <span class="material-symbols-outlined text-[40px]">local_mall</span>
      </div>
      <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-success rounded-full flex items-center justify-center text-white border-2 border-slate-50 shadow-sm">
        <span class="material-symbols-outlined text-[18px] font-bold">check</span>
      </div>
    </div>

    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-3 leading-tight">Your order details are ready!</h1>
    <p class="text-slate-500 font-medium mb-10 leading-relaxed px-4">Just tap Send in WhatsApp to finalise your purchase.</p>

    <button id="btn-reopen-wa" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full font-bold text-lg flex items-center justify-center py-4 gap-3 shadow-md transition-all active:scale-[0.98] mb-8">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/WhatsApp_icon.png" class="w-6 h-6 filter brightness-0 invert" alt="WA">
      Open WhatsApp
    </button>
    

    <a href="index.html" class="inline-flex items-center gap-2 text-sm font-bold text-primary hover:text-primary-dark transition-colors group">
      Continue Shopping <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
    </a>

  </main>
  
  <script type="module" src="js/pages/confirmation.js"></script>
</body>
</html>
